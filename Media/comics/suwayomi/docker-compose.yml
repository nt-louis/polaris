services:
  suwayomi:
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -w '%{http_code}' http://localhost:4567/ | grep -Eq '^[234][0-9]{2}$'"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    network_mode: "container:media-gateway-comics-gluetun"
    volumes:
      - ./data:/home/suwayomi/.local/share/Tachidesk
      - ${MEDIA_SHARE}/media/Books:/books
    restart: unless-stopped

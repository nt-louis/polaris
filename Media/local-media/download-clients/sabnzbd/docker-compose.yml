services:
  sabnzbd:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: ghcr.io/linuxserver/sabnzbd:5.1.2
    container_name: sabnzbd
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    network_mode: "container:media-gateway-core-gluetun"
    volumes:
      - ./config:/config
      - ${MEDIA_SHARE}:/share
    restart: unless-stopped

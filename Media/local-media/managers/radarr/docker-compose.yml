services:
  radarr:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/initialize.js || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: ghcr.io/linuxserver/radarr:6.4.3-nightly
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    network_mode: "container:media-gateway-core-gluetun"
    volumes:
      - ./config:/config
      - ${MEDIA_SHARE}:/share
    restart: unless-stopped

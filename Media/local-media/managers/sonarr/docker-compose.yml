services:
  sonarr:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/initialize.js || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: ghcr.io/linuxserver/sonarr:4.0.19.2979-ls322
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    network_mode: "container:media-gateway-core-gluetun"
    volumes:
      - ./config:/config
      - ${MEDIA_SHARE}:/share
    restart: unless-stopped

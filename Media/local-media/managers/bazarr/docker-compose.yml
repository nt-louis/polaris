services:
  bazarr:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: bazarr
    image: ghcr.io/linuxserver/bazarr:1.6.1-development
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
    network_mode: "container:media-gateway-core-gluetun"
    volumes:
      - ./config:/config
      - ${MEDIA_SHARE}:/share

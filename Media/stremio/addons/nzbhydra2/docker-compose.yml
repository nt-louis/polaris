services:
  nzbhydra2:
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5076/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: ghcr.io/hotio/nzbhydra2:release-8.9.0
    container_name: nzbhydra2
    restart: unless-stopped
    network_mode: "container:media-gateway-stremio-addons-gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ./config:/config

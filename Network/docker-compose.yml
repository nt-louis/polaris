services:
  gluetun:
    image: qmcgaw/gluetun:latest
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    container_name: network-gateway-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT:-51820}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      - DOT=off
      - DNS_ADDRESS=1.1.1.1
      - FIREWALL_INPUT_PORTS=53,3000
      - HEALTH_SUCCESS_WAIT_DURATION=30s
    volumes:
      - ./state/gluetun:/gluetun
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: network-gateway-tailscale
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_EXTRA_ARGS=--accept-routes=false --accept-dns=false
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "ip rule add lookup 52 priority 50 2>/dev/null; iptables -I INPUT -i tailscale0 -j ACCEPT 2>/dev/null; iptables -I INPUT -i tailscale0 -p tcp --dport 3001 -j DROP 2>/dev/null; iptables-nft -I INPUT -i tailscale0 -j ACCEPT 2>/dev/null; iptables-nft -I INPUT -i tailscale0 -p tcp --dport 3001 -j DROP 2>/dev/null; iptables -I OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null; iptables-nft -I OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null; iptables -P FORWARD ACCEPT 2>/dev/null; iptables-nft -P FORWARD ACCEPT 2>/dev/null; exec /usr/local/bin/containerboot" ]
    restart: unless-stopped

  adguardhome:
    image: adguard/adguardhome:v0.107.79
    container_name: network-gateway-adguard
    network_mode: "service:gluetun"
    volumes:
      - ./state/adguard/work:/opt/adguardhome/work
      - ./state/adguard/conf:/opt/adguardhome/conf
      # Mount host certificates (adjusting for common Caddy path)
      - /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${ADGUARD_DOMAIN}:/opt/adguardhome/certs:ro
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    container_name: network-gateway-caddy
    labels:
      - "wud.tag.include=^2(\\.\\d+)*-alpine$"
    network_mode: "service:gluetun"
    environment:
      - TAILNET_FQDN=${TAILNET_FQDN}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
      - tailscale-sock:/var/run/tailscale
    restart: unless-stopped

volumes:
  tailscale-sock:

name: Renovate Dependency Bot

on:
  schedule:
    # Run daily at 2:00 AM Toronto time (6:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime via GitHub Actions tab

jobs:
  renovate:
    name: Renovate Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Docker Hub Host Rules
        run: |
          if [ -n "${{ secrets.DOCKER_HUB_USERNAME }}" ]; then
            echo 'RENOVATE_HOST_RULES=[{"matchHost":"docker.io","hostType":"docker","username":"${{ secrets.DOCKER_HUB_USERNAME }}","password":"${{ secrets.DOCKER_HUB_PASSWORD }}"}]' >> $GITHUB_ENV
          fi

      - name: Self-Hosted Renovate Action
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          RENOVATE_DOCKER_MAX_PAGES: "1000"




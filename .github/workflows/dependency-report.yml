name: Container Dependency & Upgrade Report

on:
  schedule:
    - cron: "0 6 * * *" # Run daily at 06:00 UTC
  workflow_dispatch: # Manual trigger anytime from GitHub Actions tab

jobs:
  report:
    name: Generate Dependency Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Dependency Report Generator
        run: |
          ./manage.py utils dependency-report

      - name: Commit & Push Updated Report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "dependency-report.md"; then
            echo "[INFO] Dependency report changed. Committing update..."
            git add dependency-report.md
            git commit -m "docs(deps): auto-update container dependency report"
            git push origin main
          else
            echo "[INFO] No changes detected in dependency-report.md."
          fi

      - name: Upload Report Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report
          path: dependency-report.md


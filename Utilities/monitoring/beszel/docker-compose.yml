services:
  beszel:
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: henrygd/beszel:0.18.8
    container_name: beszel
    restart: unless-stopped
    network_mode: "container:utilities-gateway-gluetun"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/beszel_data
      - ./beszel_socket:/beszel_socket
    environment:
      - PORT=8090
      - APP_URL=${BESZEL_APP_URL}
      - USER_CREATION=true
      - DISABLE_PASSWORD_AUTH=${BESZEL_DISABLE_PASSWORD_AUTH}

  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_socket:/beszel_socket
    environment:
      - KEY=${BESZEL_KEY}
      - LISTEN=/beszel_socket/beszel.sock
      - TOKEN=${BESZEL_TOKEN}

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    container_name: utilities-gateway-gluetun
    extra_hosts:
      - "core.${TAILNET_SUFFIX}:${CORE_IP}"
      - "addons.${TAILNET_SUFFIX}:${ADDONS_IP}"
      - "stremio-util.${TAILNET_SUFFIX}:${STREMIO_UTIL_IP}"
      - "util.${TAILNET_SUFFIX}:${UTIL_IP}"
      - "comics.${TAILNET_SUFFIX}:${COMICS_IP}"
      - "dns-gateway.${TAILNET_SUFFIX}:${DNS_GATEWAY_IP}"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:4302:80"  # Bound strictly to loopback
      - "127.0.0.1:2375:2375" # Expose secure Docker Proxy to host loopback for host-mode containers
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT:-51820}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      - FIREWALL_INPUT_PORTS=80,443
      - FIREWALL_OUTBOUND_SUBNETS=100.64.0.0/10,172.16.0.0/12  # Allow outbound connections to the Tailnet & Docker Bridge (e.g. Authentik LDAP Outpost)
      - HTTP_CONTROL_SERVER_ADDRESS=:8002
      - HEALTH_SUCCESS_WAIT_DURATION=30s
    volumes:
      - ./state/gluetun:/gluetun
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:v1.102.3
    container_name: utilities-gateway-tailscale
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_EXTRA_ARGS=--accept-routes=false --accept-dns=false
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    volumes:
      - ./state/tailscale:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
    entrypoint: ["/bin/sh", "-c"]
    command: ["ip rule add lookup 52 priority 50 2>/dev/null; iptables -I INPUT -i tailscale0 -j ACCEPT 2>/dev/null; iptables-nft -I INPUT -i tailscale0 -j ACCEPT 2>/dev/null; iptables -I OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null; iptables-nft -I OUTPUT -o tailscale0 -j ACCEPT 2>/dev/null; iptables -P FORWARD ACCEPT 2>/dev/null; iptables-nft -P FORWARD ACCEPT 2>/dev/null; exec /usr/local/bin/containerboot"]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine
    container_name: utilities-gateway-caddy
    labels:
      - "wud.tag.include=^2(\\.\\d+)*-alpine$"
    network_mode: "service:gluetun"
    environment:
      - TAILNET_FQDN=${TAILNET_FQDN}
      - N8N_DOMAIN=${N8N_DOMAIN}
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
      - tailscale-sock:/var/run/tailscale
    restart: unless-stopped

volumes:
  tailscale-sock:

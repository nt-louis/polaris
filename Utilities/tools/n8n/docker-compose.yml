services:
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    network_mode: "container:utilities-gateway-gluetun"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${N8N_POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - POSTGRES_DB=${N8N_POSTGRES_DB:-n8n}
      - PGPORT=5433
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -p 5433 -U n8n -d n8n']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: n8nio/n8n:2.38.3@sha256:4b76b9c5a69dc1c0f26bedd21b4e281ac2c84bd88d33857487b9e63dd0a42e87
    container_name: n8n
    network_mode: "container:utilities-gateway-gluetun"
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      # Core
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      # Database (PostgreSQL)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=127.0.0.1
      - DB_POSTGRESDB_PORT=5433
      - DB_POSTGRESDB_USER=${N8N_POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-n8n}
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      # Performance & Privacy
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ./data:/home/node/.n8n
    restart: unless-stopped

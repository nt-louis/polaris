services:
  supabase-db:
    image: supabase/postgres:15.14.1.168
    container_name: supabase-db
    restart: unless-stopped
    networks:
      - vps_b_net
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./db-data:/var/lib/postgresql/data

  supabase-meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: supabase-meta
    restart: unless-stopped
    networks:
      - vps_b_net
    depends_on:
      - supabase-db
    environment:
      - PG_META_PORT=8083
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8083/health').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  supabase-rest:
    image: postgrest/postgrest:v12.2.12
    container_name: supabase-rest
    restart: unless-stopped
    networks:
      - vps_b_net
    depends_on:
      - supabase-db
    environment:
      - PGRST_DB_URI=postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - PGRST_DB_SCHEMA=public,storage,graphql_public
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET}

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    container_name: supabase-auth
    restart: unless-stopped
    networks:
      - vps_b_net
    depends_on:
      - supabase-db
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - GOTRUE_JWT_SECRET=${JWT_SECRET}
      - GOTRUE_SITE_URL=${SITE_URL}
      - API_EXTERNAL_URL=${API_EXTERNAL_URL}

  storage:
    image: supabase/storage-api:v1.72.10
    container_name: supabase-storage
    restart: unless-stopped
    networks:
      - vps_b_net
    depends_on:
      - supabase-db
      - supabase-rest
    volumes:
      - ./storage-data:/var/lib/storage
    environment:
      - ANONYMOUS_KEY=${ANON_KEY}
      - SERVICE_KEY=${SERVICE_ROLE_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - PORT=5000
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - AUTH_JWT_SECRET=${JWT_SECRET}
      - POSTGREST_URL=http://supabase-rest:3000
      - STORAGE_BACKEND=file
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage

  supabase-studio:
    image: supabase/studio@sha256:7961864f4a1163c11b721eec1ade401add512a5f23408283632165715f11caad
    container_name: supabase-studio
    restart: unless-stopped
    networks:
      - vps_b_net
    environment:
      - SUPABASE_URL=${SUPABASE_PUBLIC_URL}
      - STUDIO_PG_META_URL=http://supabase-meta:8083
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://' + require('os').hostname() + ':3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  supabase-kong:
    image: kong/kong:3.9.3
    container_name: supabase-kong
    restart: unless-stopped
    networks:
      - vps_b_net
    depends_on:
      - supabase-rest
      - supabase-auth
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    volumes:
      - ./kong.yml:/home/kong/temp.yml:ro
      - ./kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000, 0.0.0.0:8443 ssl http2
      - KONG_ROUTER_FLAVOR=expressions
      - SUPABASE_ANON_KEY=${ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY}

networks:
  vps_b_net:
    name: vps_b_net
    external: true

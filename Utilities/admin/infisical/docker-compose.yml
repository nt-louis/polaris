services:
  backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: infisical/infisical:v0.165.2
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${INFISICAL_REDIS_PASSWORD}@redis:6379
    networks:
      - vps_b_net

  redis:
    image: redis:8-alpine
    container_name: infisical-redis
    restart: always
    command: redis-server --requirepass ${INFISICAL_REDIS_PASSWORD}
    networks:
      - vps_b_net
    volumes:
      - ./data/redis:/data

  db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - vps_b_net
    healthcheck:
      test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10

networks:
  vps_b_net:
    external: true

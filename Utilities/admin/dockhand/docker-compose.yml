services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    network_mode: host  # Run on host network to reach Tailnet VPS B
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only!
      - ./data:/app/data
    environment:
      - HOST=127.0.0.1  # Bound strictly to loopback 127.0.0.1
      - PORT=8000
      - DB_CLIENT=sqlite
      - DB_SQLITE_PATH=/app/data/dockhand.db

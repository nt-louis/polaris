services:
  seanime:
    image: umagistr/seanime:v3.10.1-rootless
    user: "1001:1001"
    container_name: seanime
    restart: unless-stopped
    network_mode: "container:media-gateway-proton-gluetun"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - HOME=/home/seanime
      - SEANIME_SERVER_PORT=43211
      - SEANIME_SERVER_HOST=0.0.0.0
    volumes:
      - ./config:/home/seanime/.config/Seanime
      - ${MEDIA_SHARE}:/share
